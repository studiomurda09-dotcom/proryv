# Сборка установщиков Windows при пуше тега вида v0.1.0.
# Результат — черновик релиза на GitHub с .msi, -setup.exe и latest.json для автообновления.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - name: Тесты ядра
        run: cargo test -p proryv-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ключ подписи обновлений (Settings → Secrets → Actions). Без него latest.json не появится.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Proryv ${{ github.ref_name }}"
          releaseBody: "Скачайте установщик для своей системы ниже. Для Windows — файл .msi или -setup.exe."
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
