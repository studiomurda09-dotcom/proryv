# Сборка установщиков Windows при пуше тега вида v0.1.0.
# Результат — опубликованный релиз на GitHub с .msi, -setup.exe и latest.json для автообновления.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      # Официальный WinDivert вместо копии из zapret. Хеш сверяется — подменённый архив сборку остановит.
      - name: WinDivert 2.2.2 (официальный)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip -OutFile wd.zip
          $hash = (Get-FileHash wd.zip -Algorithm SHA256).Hash
          if ($hash -ne "63CB41763BB4B20F600B6DE04E991A9C2BE73279E317D4D82F237B150C5F3F15") { throw "WinDivert: неверный хеш $hash" }
          Expand-Archive wd.zip wd
          Copy-Item wd/WinDivert-2.2.2-A/x64/WinDivert.dll, wd/WinDivert-2.2.2-A/x64/WinDivert64.sys third_party/windivert/ -Force

      - name: Тесты ядра
        run: cargo test -p proryv-core

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ключ подписи обновлений (Settings → Secrets → Actions). Без него latest.json не появится.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Proryv ${{ github.ref_name }}"
          releaseBody: |
            ## Скачать
            **`Proryv_…_x64-setup.exe`** — обычный установщик (рекомендуется), `.msi` — для тех, кому так привычнее.
            Если Proryv уже стоит, обновляться не нужно: программа сама предложит обновление.

            **Первый запуск:** разрешите права администратора, затем «Автоподбор» → «Подобрать» и большая кнопка на главной.
            Если Защитник Windows ругается на драйвер WinDivert: «Подробнее» → «Выполнить в любом случае».
            Не запускайте одновременно zapret или GoodbyeDPI.
            Помощь и новости — в Discord: https://discord.gg/SzRm7GNyU9

            ## Download
            Get **`Proryv_…_x64-setup.exe`** (or the `.msi`). Existing installs update themselves from inside the app.
            First run: allow administrator rights, then Auto-tune → Find, and press the big button on Home.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
