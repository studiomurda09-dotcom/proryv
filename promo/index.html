<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Proryv — промо</title>
<style>
  :root { --accent: #7cc4e4; --font: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d12; font-family: var(--font); color: #fff; }

  /* Фон: медленные цветные пятна */
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg i { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width: 900px; height: 900px; left: -200px; top: -250px; background: #3b2f8f; }
  .bg i:nth-child(2) { width: 800px; height: 800px; right: -200px; top: 200px; background: #0f6e7a; animation-delay: -6s; }
  .bg i:nth-child(3) { width: 700px; height: 700px; left: 600px; bottom: -400px; background: #24408f; animation-delay: -11s; }
  @keyframes drift { to { transform: translate(120px, 80px) scale(1.15); } }
  .grain { position: absolute; inset: 0; opacity: .05; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 3px 3px; }

  /* Окно программы */
  #win {
    position: absolute; left: 0; top: 0; width: 1130px; height: 720px; transform-origin: 0 0;
    border-radius: 10px; overflow: hidden; background: #1c1c1f;
    box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    transition: transform 1.1s cubic-bezier(.65,0,.25,1), opacity .8s ease;
    opacity: 0;
  }
  #win iframe { width: 1130px; height: 720px; border: 0; display: block; }

  /* Курсор */
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; z-index: 20; pointer-events: none;
    transition-property: transform; transition-timing-function: cubic-bezier(.45,0,.2,1); opacity: 0; }
  #cursor svg { filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  .ripple { position: absolute; z-index: 19; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%;
    border: 3px solid var(--accent); animation: ripple .55s ease-out forwards; pointer-events: none; }
  @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  /* Титры */
  .caption { position: absolute; left: 110px; bottom: 96px; z-index: 15; display: flex; gap: 22px; align-items: stretch;
    transform: translateX(-60px); opacity: 0; transition: transform .6s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .caption.on { transform: none; opacity: 1; }
  .caption .bar { width: 6px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 24px var(--accent); }
  .caption b { display: block; font-size: 54px; font-weight: 700; letter-spacing: -.5px; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
  .caption small { display: block; font-size: 26px; color: #cfd6e0; margin-top: 6px; text-shadow: 0 2px 16px rgba(0,0,0,.8); }
  .caption .bg-plate { position: absolute; inset: -26px -40px -26px -34px; z-index: -1; border-radius: 16px;
    background: rgba(10,12,18,.62); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,.08); }

  /* Заставка и финал */
  .title { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .title .inner { transform: scale(.9); opacity: 0; transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s; }
  .title.on .inner { transform: none; opacity: 1; }
  .logo { display: block; width: 170px; height: 170px; margin: 0 auto 30px; border-radius: 38px; box-shadow: 0 20px 80px rgba(124,196,228,.4); }
  .title h1 { margin: 0; font-size: 132px; letter-spacing: -3px; line-height: 1; }
  .title p { margin: 22px 0 0; font-size: 36px; color: #c9d3df; }
  .title .chips { margin-top: 34px; display: flex; gap: 14px; justify-content: center; }
  .title .chips span { padding: 10px 22px; border-radius: 99px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); font-size: 24px; }
  .title .url { margin-top: 30px; font-size: 26px; color: var(--accent); }
  .title .url + .url { margin-top: 10px; color: #b4a6ff; }
  .flash { position: absolute; inset: 0; z-index: 40; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }
</style>
</head>
<body>
  <div class="bg"><i></i><i></i><i></i></div>
  <div class="grain"></div>

  <div id="win"><iframe id="app" src="/index.html?shot=1&lang=ru&p=home#home"></iframe></div>

  <div id="cursor"><svg viewBox="0 0 24 24" width="34" height="34"><path d="M4 2.5v17.2l4.7-4.4 3.1 6.9 3-1.3-3.1-6.8h6.5z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg></div>

  <div class="caption" id="caption"><div class="bg-plate"></div><div class="bar"></div><div><b id="cap-t"></b><small id="cap-s"></small></div></div>

  <div class="title" id="intro"><div class="inner">
    <img class="logo" src="/promo/app-icon.svg" alt="" />
    <h1>Proryv</h1>
    <p>YouTube, Discord и Telegram — без VPN</p>
  </div></div>

  <div class="title" id="outro"><div class="inner">
    <img class="logo" src="/promo/app-icon.svg" alt="" />
    <h1>Proryv</h1>
    <div class="chips"><span>Бесплатно</span><span>Открытый код</span><span>Windows 10/11</span></div>
    <div class="url">github.com/studiomurda09-dotcom/proryv</div>
    <div class="url">discord.gg/SzRm7GNyU9</div>
  </div></div>

  <div class="flash" id="flash"></div>
  <script src="sfx.js"></script>
  <script src="director.js"></script>
</body>
</html>
