[workspace]
resolver = "2"
members = ["crates/proryv-core", "crates/proryv-tg", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
